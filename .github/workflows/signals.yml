name: News calendar

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-calendar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update high-impact news calendar
        run: node scripts/calendar-job.mjs
      - name: Save results
        run: |
          git config user.name "signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Update news calendar [skip ci]"
          git pull --rebase origin main
          git push
