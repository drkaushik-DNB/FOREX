name: 24/7 signal log

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-log
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check markets and update the log
        run: node scripts/signal-job.mjs
      - name: Save results
        run: |
          git config user.name "signal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Update 24/7 signal log [skip ci]"
          git pull --rebase origin main
          git push
